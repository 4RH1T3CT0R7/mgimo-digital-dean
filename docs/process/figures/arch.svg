<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Схема архитектуры">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e3f8c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b26b00"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#566174"/></marker>
  </defs>
  <!-- браузер -->
  <rect x="10" y="200" width="140" height="80" rx="10" fill="#fff" stroke="#1e3f8c" stroke-width="1.6"/>
  <text x="80" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1d24">Браузер или PWA</text>
  <text x="80" y="252" text-anchor="middle" font-size="12" fill="#566174">React SPA</text>
  <line x1="150" y1="240" x2="186" y2="240" stroke="#1e3f8c" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="168" y="230" text-anchor="middle" font-size="11" fill="#566174">HTTPS</text>
  <!-- caddy -->
  <rect x="190" y="140" width="150" height="200" rx="10" fill="#eef2fa" stroke="#1e3f8c" stroke-width="1.6"/>
  <text x="265" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1d24">Caddy — шлюз</text>
  <text x="205" y="198" font-size="11.5" fill="#1a1d24">HTTPS и HSTS</text>
  <text x="205" y="220" font-size="11.5" fill="#1a1d24">отдаёт SPA</text>
  <text x="205" y="242" font-size="11.5" fill="#1a1d24">удаляет X-User-*</text>
  <text x="205" y="264" font-size="11.5" fill="#1a1d24">спрашивает auth:</text>
  <text x="205" y="280" font-size="11.5" fill="#1a1d24">сессия жива?</text>
  <text x="205" y="306" font-size="11.5" fill="#1a1d24">пускает только</text>
  <text x="205" y="322" font-size="11.5" fill="#1a1d24">на порт 8080</text>
  <!-- стрелки шлюз -> сервисы -->
  <line x1="340" y1="200" x2="388" y2="61" stroke="#1e3f8c" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="340" y1="215" x2="388" y2="141" stroke="#1e3f8c" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="340" y1="230" x2="388" y2="221" stroke="#1e3f8c" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="340" y1="250" x2="388" y2="301" stroke="#1e3f8c" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="340" y1="265" x2="388" y2="381" stroke="#1e3f8c" stroke-width="1.3" marker-end="url(#ar)"/>
  <!-- сервисы -->
  <g font-size="11" fill="#566174">
    <rect x="390" y="30" width="190" height="62" rx="9" fill="#fff" stroke="#1e3f8c" stroke-width="1.4"/>
    <text x="404" y="56" font-size="14" font-weight="600" fill="#1a1d24">auth</text>
    <text x="404" y="76">вход и сессии</text>
    <rect x="390" y="110" width="190" height="62" rx="9" fill="#fff" stroke="#1e3f8c" stroke-width="1.4"/>
    <text x="404" y="136" font-size="14" font-weight="600" fill="#1a1d24">requests</text>
    <text x="404" y="156">заявки и справки</text>
    <rect x="390" y="190" width="190" height="62" rx="9" fill="#fff" stroke="#1e3f8c" stroke-width="1.4"/>
    <text x="404" y="216" font-size="14" font-weight="600" fill="#1a1d24">academic</text>
    <text x="404" y="236">расписание и оценки</text>
    <rect x="390" y="270" width="190" height="62" rx="9" fill="#fff" stroke="#1e3f8c" stroke-width="1.4"/>
    <text x="404" y="296" font-size="14" font-weight="600" fill="#1a1d24">notifications</text>
    <text x="404" y="316">уведомления, новости</text>
    <rect x="390" y="350" width="190" height="62" rx="9" fill="#fff" stroke="#1e3f8c" stroke-width="1.4"/>
    <text x="404" y="376" font-size="14" font-weight="600" fill="#1a1d24">assistant</text>
    <text x="404" y="396">ИИ-помощник</text>
  </g>
  <!-- иконки БД в сервисах -->
  <g fill="#f4f6fa" stroke="#1e3f8c" stroke-width="1">
    <path d="M548,44 v18 a10,4 0 0 0 20,0 v-18 a10,4 0 0 0 -20,0 a10,4 0 0 0 20,0"/>
    <path d="M548,124 v18 a10,4 0 0 0 20,0 v-18 a10,4 0 0 0 -20,0 a10,4 0 0 0 20,0"/>
    <path d="M548,204 v18 a10,4 0 0 0 20,0 v-18 a10,4 0 0 0 -20,0 a10,4 0 0 0 20,0"/>
    <path d="M548,284 v18 a10,4 0 0 0 20,0 v-18 a10,4 0 0 0 -20,0 a10,4 0 0 0 20,0"/>
    <path d="M548,364 v18 a10,4 0 0 0 20,0 v-18 a10,4 0 0 0 -20,0 a10,4 0 0 0 20,0"/>
  </g>
  <g font-size="9" fill="#566174" text-anchor="middle">
    <text x="558" y="80">БД</text><text x="558" y="160">БД</text><text x="558" y="240">БД</text><text x="558" y="320">БД</text><text x="558" y="400">БД</text>
  </g>
  <!-- внутренний API -->
  <line x1="470" y1="172" x2="470" y2="188" stroke="#566174" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="470" y1="270" x2="470" y2="254" stroke="#566174" stroke-width="1.6" marker-end="url(#ag)"/>
  <!-- NATS -->
  <rect x="630" y="120" width="120" height="200" rx="10" fill="#fff5e6" stroke="#b26b00" stroke-width="1.6"/>
  <text x="690" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1d24">NATS</text>
  <text x="690" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1d24">JetStream</text>
  <text x="690" y="240" text-anchor="middle" font-size="11" fill="#566174">события</text>
  <line x1="580" y1="141" x2="628" y2="141" stroke="#b26b00" stroke-width="1.5" marker-end="url(#ao)"/>
  <line x1="580" y1="221" x2="628" y2="221" stroke="#b26b00" stroke-width="1.5" marker-end="url(#ao)"/>
  <line x1="630" y1="301" x2="582" y2="301" stroke="#b26b00" stroke-width="1.5" marker-end="url(#ao)"/>
  <!-- LLM -->
  <rect x="630" y="350" width="120" height="62" rx="10" fill="#fff" stroke="#566174" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="690" y="376" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1d24">LLM-API</text>
  <text x="690" y="394" text-anchor="middle" font-size="10.5" fill="#566174">ключ только здесь</text>
  <line x1="580" y1="381" x2="628" y2="381" stroke="#566174" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <!-- PostgreSQL -->
  <rect x="190" y="436" width="560" height="50" rx="10" fill="#f4f6fa" stroke="#1e3f8c" stroke-width="1.4"/>
  <text x="206" y="458" font-size="13" font-weight="600" fill="#1a1d24">PostgreSQL</text>
  <text x="206" y="476" font-size="11" fill="#566174">пять отдельных баз, у каждой свой пользователь: сервис физически не может прочитать чужие таблицы</text>
  <text x="10" y="458" font-size="10.5" fill="#566174">Серые стрелки —</text>
  <text x="10" y="472" font-size="10.5" fill="#566174">внутренний API, порт 8081,</text>
  <text x="10" y="486" font-size="10.5" fill="#566174">снаружи закрыт</text>
</svg>
