openapi: 3.0.3
info:
  title: auth — вход и сессии
  version: 1.0.0
  description: |
    Публичный API сервиса `auth`. Соглашения — docs/contracts/README.md.
    Сессия — cookie `sid` (`HttpOnly; Secure; SameSite=Lax; Path=/`), срок жизни 24 часа.
    В БД хранится только SHA-256 от токена сессии.
servers:
  - url: /api/auth
security:
  - sessionCookie: []
paths:
  /login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      description: |
        Роли: все (без входа).
        Защита от перебора: не более 5 неудачных попыток на логин и 30 на IP за 15 минут, иначе 429.
        Сообщение об ошибке одинаковое для неверного логина и неверного пароля.
        При успехе — новая сессия (старый токен из запроса, если был, не переиспользуется).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вход выполнен
          headers:
            Set-Cookie:
              description: Cookie сессии `sid`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Неверный логин или пароль (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /logout:
    post:
      operationId: logout
      summary: Выход
      description: |
        Роли: все. Удаляет сессию в БД и очищает cookie. Без сессии тоже отвечает 204.
      security: []
      responses:
        '204':
          description: Выход выполнен
          headers:
            Set-Cookie:
              description: Очистка cookie `sid` (Max-Age=0)
              schema:
                type: string
  /me:
    get:
      operationId: getMe
      summary: Текущий пользователь
      description: Роли — student, staff, admin.
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me/sessions:
    get:
      operationId: listMySessions
      summary: Где выполнен вход — действующие сеансы
      description: |
        Роли — student, staff, admin. Сначала недавно активные. Текущий сеанс определяется по cookie `sid`.
        Об устройстве хранится только подпись «браузер · система» — без User-Agent целиком и без IP (152-ФЗ, минимизация).
      responses:
        '200':
          description: Сеансы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me/sessions/others:
    delete:
      operationId: endOtherSessions
      summary: Выйти на всех других устройствах
      description: Роли — student, staff, admin. Текущий сеанс остаётся.
      responses:
        '200':
          description: Сколько сеансов завершено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndedSessions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
  responses:
    ValidationFailed:
      description: Неверные данные (`validation_failed`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Нет сессии или она истекла (`unauthenticated`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: Слишком много попыток (`too_many_attempts`)
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Role:
      type: string
      enum: [student, staff, admin]
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
    Me:
      type: object
      required: [id, login, role, display_name]
      properties:
        id:
          type: string
          format: uuid
          description: Для студента совпадает с ID студента в `academic`
        login:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        display_name:
          type: string
          description: Короткое имя для шапки, например «Лебедева А. В.» или «Деканат ФМО»
        faculty_id:
          type: string
          format: uuid
          nullable: true
          description: Только у роли staff
    Session:
      type: object
      required: [device, created_at, last_seen_at, current]
      properties:
        device:
          type: string
          description: Браузер и система
          example: Chrome · Windows
        created_at:
          type: string
          format: date-time
          description: Когда выполнен вход
        last_seen_at:
          type: string
          format: date-time
          description: Последний запрос с этого устройства
        current:
          type: boolean
          description: Сеанс, с которого пришёл запрос
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    EndedSessions:
      type: object
      required: [ended]
      properties:
        ended:
          type: integer
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинный код ошибки (README, таблица ошибок)
        message:
          type: string
          description: Сообщение по-русски, можно показать пользователю
        details:
          type: object
          additionalProperties: true
          description: 'Для validation_failed: { "fields": { "<поле>": "<текст ошибки>" } }'
