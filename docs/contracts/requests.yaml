openapi: 3.0.3
info:
  title: requests — услуги и заявки
  version: 1.0.0
  description: |
    Публичный API сервиса `requests`. Соглашения — docs/contracts/README.md.
    Статусы и допустимые переходы, срок готовности, номер заявки — docs/contracts/data-model.md.
    Вложения: до 5 МБ, типы application/pdf, image/jpeg, image/png; хранятся в БД.
servers:
  - url: /api/requests
security:
  - sessionCookie: []
tags:
  - name: student
  - name: staff
  - name: public
paths:
  /service-types:
    get:
      tags: [student]
      operationId: listServiceTypes
      summary: Каталог услуг
      description: Роли — student, staff, admin. Только активные, в порядке sort_order.
      responses:
        '200':
          description: Услуги
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceType'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me/applications:
    get:
      tags: [student]
      operationId: listMyApplications
      summary: Мои заявки (F4)
      description: Роли — student. Сначала новые (по updated_at).
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - in: query
          name: answered
          description: true — только те, где пришёл ответ (status ready/needs_info/rejected или последнее сообщение от деканата)
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [student]
      operationId: createApplication
      summary: Подать заявку
      description: |
        Роли — student. Поля проверяются по `ServiceType.fields`; ошибки — в details.fields.
        Сервис один раз запрашивает у academic карточку студента и сохраняет слепок (D32).
        Для услуги kind=instant_certificate заявка сразу создаётся в статусе `ready` вместе со справкой (I1).
        Публикует `requests.application.status_changed` (old_status = null).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/applications/{application_id}:
    get:
      tags: [student]
      operationId: getMyApplication
      summary: Заявка с историей, перепиской и вложениями
      description: Роли — student. Чужая или несуществующая — 404.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/applications/{application_id}/cancel:
    post:
      tags: [student]
      operationId: cancelMyApplication
      summary: Отозвать заявку
      description: Роли — student. Только из статуса `submitted`, иначе 409.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Заявка отозвана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /me/applications/{application_id}/messages:
    post:
      tags: [student]
      operationId: postMyMessage
      summary: Написать в деканат по заявке (I3)
      description: |
        Роли — student. Нельзя в статусах rejected и cancelled (409).
        Если заявка в `needs_info`, она автоматически переходит в `in_progress`.
        Публикует `requests.application.message_added`.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '201':
          description: Сообщение добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /me/applications/{application_id}/attachments:
    post:
      tags: [student]
      operationId: uploadMyAttachment
      summary: Приложить файл к заявке
      description: |
        Роли — student. Только если у услуги attachments.allowed и статус submitted или needs_info (иначе 409).
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: Файл сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFileType'
  /me/applications/{application_id}/attachments/{attachment_id}:
    get:
      tags: [student]
      operationId: downloadMyAttachment
      summary: Скачать вложение
      description: Роли — student. Отдаётся с Content-Disposition attachment.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          $ref: '#/components/responses/FileContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/applications/{application_id}/certificate.pdf:
    get:
      tags: [student]
      operationId: downloadMyCertificate
      summary: Скачать справку с места учёбы (I1)
      description: |
        Роли — student. Только для услуг kind=instant_certificate в статусе ready, иначе 404.
        PDF генерируется на лету из слепка; на каждой странице водяной знак «КОНЦЕПТ. НЕ ЯВЛЯЕТСЯ ДОКУМЕНТОМ»,
        код проверки и адрес страницы проверки.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: PDF
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/certificates/{code}:
    get:
      tags: [public]
      operationId: verifyCertificate
      summary: Проверка справки по коду
      description: |
        Без входа. Минимум данных: инициалы, факультет, даты. Нет кода — 404.
        Ограничение: 30 запросов в минуту с одного IP, иначе 429.
      security: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
            pattern: '^[A-Z2-7]{10}$'
      responses:
        '200':
          description: Справка найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerification'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /staff/stats:
    get:
      tags: [staff]
      operationId: getStaffStats
      summary: Счётчики для главной сотрудника
      description: Роли — staff (свой факультет), admin (все).
      responses:
        '200':
          description: Счётчики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffStats'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /staff/applications:
    get:
      tags: [staff]
      operationId: listStaffApplications
      summary: Входящие заявки
      description: |
        Роли — staff (только заявки своего факультета), admin (все; можно фильтровать по faculty_id).
        Сначала просроченные, затем по due_at, затем по created_at.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - in: query
          name: service_type_id
          schema:
            type: string
        - in: query
          name: faculty_id
          description: Только для admin; у staff игнорируется
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          description: Поиск по номеру заявки или ФИО студента
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffApplicationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /staff/applications/{application_id}:
    get:
      tags: [staff]
      operationId: getStaffApplication
      summary: Заявка для сотрудника
      description: Роли — staff (свой факультет, иначе 404), admin.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffApplication'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /staff/applications/{application_id}/status:
    post:
      tags: [staff]
      operationId: changeApplicationStatus
      summary: Сменить статус заявки
      description: |
        Роли — staff (свой факультет), admin. Недопустимый переход — 409 (`invalid_transition`).
        Для needs_info и rejected комментарий обязателен (400). Комментарий виден студенту.
        Публикует `requests.application.status_changed`.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: Заявка после смены статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffApplication'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /staff/applications/{application_id}/messages:
    post:
      tags: [staff]
      operationId: postStaffMessage
      summary: Ответить студенту по заявке (I3)
      description: |
        Роли — staff (свой факультет), admin. Нельзя в статусах rejected и cancelled (409).
        Публикует `requests.application.message_added`.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '201':
          description: Сообщение добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /staff/applications/{application_id}/attachments:
    post:
      tags: [staff]
      operationId: uploadStaffAttachment
      summary: Приложить документ (например, готовую справку)
      description: |
        Роли — staff (свой факультет), admin. is_result=true помечает файл как результат услуги.
        Нельзя в статусах rejected и cancelled (409).
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: Файл сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFileType'
  /staff/applications/{application_id}/attachments/{attachment_id}:
    get:
      tags: [staff]
      operationId: downloadStaffAttachment
      summary: Скачать вложение
      description: Роли — staff (свой факультет), admin.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          $ref: '#/components/responses/FileContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
  parameters:
    ApplicationId:
      in: path
      name: application_id
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      in: path
      name: attachment_id
      required: true
      schema:
        type: string
        format: uuid
    StatusFilter:
      in: query
      name: status
      description: Можно несколько через запятую
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ApplicationStatus'
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    ValidationFailed:
      description: Неверные данные (`validation_failed`), ошибки по полям в details.fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Нет сессии (`unauthenticated`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Роль не подходит (`forbidden`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Не найдено или чужое (`not_found`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidTransition:
      description: Действие недопустимо в текущем статусе (`invalid_transition`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileTooLarge:
      description: Файл больше 5 МБ (`file_too_large`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedFileType:
      description: Тип файла не разрешён (`unsupported_file_type`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: Слишком много запросов (`too_many_attempts`)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileContent:
      description: Файл
      headers:
        Content-Disposition:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
  schemas:
    ApplicationStatus:
      type: string
      description: |
        submitted — подана; in_progress — в работе; needs_info — нужны уточнения от студента;
        ready — готово (для вопроса — ответ дан); rejected — отклонена; cancelled — отозвана студентом.
      enum: [submitted, in_progress, needs_info, ready, rejected, cancelled]
    ServiceKind:
      type: string
      description: |
        instant_certificate — формируется сразу (I1); document — оформляет сотрудник;
        question — вопрос в деканат, только переписка (I3).
      enum: [instant_certificate, document, question]
    ServiceType:
      type: object
      required: [id, title, description, category, kind, sla_days, fields, attachments]
      properties:
        id:
          type: string
          description: Slug
          example: study-certificate
        title:
          type: string
          example: Справка с места учёбы
        description:
          type: string
        category:
          type: string
          enum: [certificates, deanery, finance, other]
        kind:
          $ref: '#/components/schemas/ServiceKind'
        sla_days:
          type: integer
          minimum: 0
          description: Срок готовности в календарных днях; 0 — сразу
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
        attachments:
          type: object
          required: [allowed, required]
          properties:
            allowed:
              type: boolean
            required:
              type: boolean
            hint:
              type: string
              nullable: true
              example: Документы, подтверждающие основание для выплаты
    FormField:
      type: object
      required: [key, label, type, required]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        label:
          type: string
        type:
          type: string
          enum: [text, textarea, select, date, number]
        required:
          type: boolean
        options:
          type: array
          description: Только для select
          items:
            type: string
        placeholder:
          type: string
          nullable: true
        max_length:
          type: integer
          nullable: true
    CreateApplicationRequest:
      type: object
      required: [service_type_id, fields]
      properties:
        service_type_id:
          type: string
        fields:
          type: object
          description: Значения полей формы по key; все значения — строки (дата YYYY-MM-DD, число — строкой)
          additionalProperties:
            type: string
        comment:
          type: string
          maxLength: 2000
          nullable: true
    ServiceTypeRef:
      type: object
      required: [id, title, kind]
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          $ref: '#/components/schemas/ServiceKind'
    ApplicationSummary:
      type: object
      required: [id, number, service_type, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Человекочитаемый номер
          example: '000123'
        service_type:
          $ref: '#/components/schemas/ServiceTypeRef'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Ожидаемая дата готовности; null для завершённых
        overdue:
          type: boolean
          description: due_at прошёл, а заявка не завершена
        last_message_at:
          type: string
          format: date-time
          nullable: true
        last_message_from:
          type: string
          nullable: true
          enum: [student, staff]
    ApplicationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSummary'
        total:
          type: integer
    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationSummary'
        - type: object
          required: [fields, status_history, messages, attachments]
          properties:
            fields:
              type: array
              description: Значения полей с подписями, в порядке формы
              items:
                type: object
                required: [key, label, value]
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  value:
                    type: string
            comment:
              type: string
              nullable: true
            status_history:
              type: array
              description: От старых к новым
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
            messages:
              type: array
              description: От старых к новым
              items:
                $ref: '#/components/schemas/Message'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
            certificate:
              allOf:
                - $ref: '#/components/schemas/CertificateInfo'
              nullable: true
              description: Только для instant_certificate в статусе ready
    StatusHistoryEntry:
      type: object
      required: [status, at, by_role]
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        at:
          type: string
          format: date-time
        by_role:
          type: string
          enum: [student, staff, system]
        comment:
          type: string
          nullable: true
    Message:
      type: object
      required: [id, author_role, author_label, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        author_role:
          type: string
          enum: [student, staff]
        author_label:
          type: string
          description: Для staff — «Деканат <факультет>» (D37); для student — краткое ФИО
          example: Деканат ФМО
        text:
          type: string
        created_at:
          type: string
          format: date-time
    MessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
    Attachment:
      type: object
      required: [id, file_name, content_type, size, uploaded_by_role, is_result, created_at]
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: string
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        size:
          type: integer
          maximum: 5242880
        uploaded_by_role:
          type: string
          enum: [student, staff]
        is_result:
          type: boolean
          description: Документ-результат услуги от деканата
        created_at:
          type: string
          format: date-time
    UploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        is_result:
          type: boolean
          description: Только у сотрудника; у студента игнорируется
    CertificateInfo:
      type: object
      required: [code, issued_at, valid_until, verify_url]
      properties:
        code:
          type: string
          example: K7M2QX4P9A
        issued_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date
          description: Выдача + 30 дней
        verify_url:
          type: string
          description: Относительный адрес страницы проверки в SPA
          example: /verify/K7M2QX4P9A
    CertificateVerification:
      type: object
      required: [valid, title, holder, faculty_short, issued_at, valid_until]
      properties:
        valid:
          type: boolean
          description: false, если срок действия истёк
        title:
          type: string
        holder:
          type: string
          description: Только инициалы и фамилия
          example: Лебедева А. В.
        faculty_short:
          type: string
        issued_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date
    StudentSnapshot:
      type: object
      description: Слепок данных студента на момент подачи заявки (D32)
      required: [id, full_name, short_name, faculty_short, course, group_name, student_card_no]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        short_name:
          type: string
        faculty_short:
          type: string
        course:
          type: integer
        group_name:
          type: string
        student_card_no:
          type: string
    StaffApplicationSummary:
      allOf:
        - $ref: '#/components/schemas/ApplicationSummary'
        - type: object
          required: [student]
          properties:
            student:
              $ref: '#/components/schemas/StudentSnapshot'
    StaffApplicationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffApplicationSummary'
        total:
          type: integer
    StaffApplication:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          required: [student, allowed_transitions]
          properties:
            student:
              $ref: '#/components/schemas/StudentSnapshot'
            allowed_transitions:
              type: array
              description: Куда сотрудник может перевести заявку сейчас (для кнопок)
              items:
                $ref: '#/components/schemas/ApplicationStatus'
    StatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        comment:
          type: string
          maxLength: 2000
          nullable: true
    StaffStats:
      type: object
      required: [submitted, in_progress, needs_info, overdue, ready_today]
      properties:
        submitted:
          type: integer
        in_progress:
          type: integer
        needs_info:
          type: integer
        overdue:
          type: integer
        ready_today:
          type: integer
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
