# Запуск: make up (нужен .env в корне, см. .env.example)
name: mgimo

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy
  environment: &service-env
    NATS_URL: nats://nats:4222
    TZ: Europe/Moscow
  healthcheck:
    test: ["CMD", "/app", "-healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 5
  # Порты наружу не публикуются: снаружи доступен только Caddy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:?}
      REQUESTS_DB_PASSWORD: ${REQUESTS_DB_PASSWORD:?}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?задайте ASSISTANT_DB_PASSWORD в .env (docs/deploy.md §8)}
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    <<: *service
    build: { context: .., args: { SERVICE: auth } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD}@postgres:5432/auth?sslmode=disable

  academic:
    <<: *service
    build: { context: .., args: { SERVICE: academic } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://academic:${ACADEMIC_DB_PASSWORD}@postgres:5432/academic?sslmode=disable

  requests:
    <<: *service
    build: { context: .., args: { SERVICE: requests } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://requests:${REQUESTS_DB_PASSWORD}@postgres:5432/requests?sslmode=disable
      ACADEMIC_INTERNAL_URL: http://academic:8081
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}

  notifications:
    <<: *service
    build: { context: .., args: { SERVICE: notifications } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://notifications:${NOTIFICATIONS_DB_PASSWORD}@postgres:5432/notifications?sslmode=disable
      ACADEMIC_INTERNAL_URL: http://academic:8081

  # ИИ-помощник (T25, P2): база знаний — своя БД (D66); справочник — content/faq.md (T19); LLM — необязательно (.env)
  assistant:
    <<: *service
    build: { context: .., args: { SERVICE: assistant } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://assistant:${ASSISTANT_DB_PASSWORD}@postgres:5432/assistant?sslmode=disable
      FAQ_PATH: /content/faq.md
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_AUTH_SCHEME: ${LLM_AUTH_SCHEME:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ../content:/content:ro

  # Шлюз + собранный SPA в одном образе (deploy/web.Dockerfile): на сервере не нужен Node
  caddy:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - caddydata:/data
    depends_on:
      auth: { condition: service_healthy }
      academic: { condition: service_healthy }
      requests: { condition: service_healthy }
      notifications: { condition: service_healthy }
      assistant: { condition: service_healthy }

volumes:
  pgdata:
  natsdata:
  caddydata:
