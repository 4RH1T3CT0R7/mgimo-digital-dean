name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make lint-contracts

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Тесты с БД обязательны в CI: без базы они падают, а не пропускаются (tasks/README.md §7)
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: Сгенерированный код совпадает с контрактами
        run: |
          make gen-sqlc gen-go
          git diff --exit-code || (echo "Запустите make gen и закоммитьте результат" && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, academic, requests, notifications, assistant]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t mgimo-${{ matrix.service }} .

  # Весь стек в Docker + проверки шлюза и изоляции (deploy/smoke.sh, security.md §6)
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: .env со случайными паролями
        run: |
          r() { openssl rand -hex 24; }
          printf 'SITE_ADDRESS=localhost\nPOSTGRES_PASSWORD=%s\nAUTH_DB_PASSWORD=%s\nACADEMIC_DB_PASSWORD=%s\nREQUESTS_DB_PASSWORD=%s\nNOTIFICATIONS_DB_PASSWORD=%s\n' "$(r)" "$(r)" "$(r)" "$(r)" "$(r)" > .env
      - run: docker compose -f deploy/docker-compose.yml --env-file .env up -d --build --wait
      - run: bash deploy/seed.sh
      - run: bash deploy/smoke.sh
      - name: Логи при ошибке
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs --tail=200
