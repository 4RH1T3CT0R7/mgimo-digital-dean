name: frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Типы API совпадают с контрактами
        run: |
          npm run gen
          git diff --exit-code -- src/api || (echo "Запустите npm run gen (make gen) и закоммитьте результат" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Решение капитана 17.11: сборку останавливает уязвимость в том, что попадает в браузер (dependencies).
      # Инструменты сборки и тестов (vite, rollup, eslint, vitest) работают только у нас с нашими файлами — их отчёт
      # для сведения: свежее предупреждение без исправленной версии (picomatch, GHSA-fc5q-39xc-vjpf) иначе блокирует любой PR.
      - name: npm audit (код в браузере)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (инструменты сборки, для сведения)
        run: npm audit --audit-level=high || echo "::warning::npm audit нашёл уязвимости в инструментах сборки — см. отчёт выше"
